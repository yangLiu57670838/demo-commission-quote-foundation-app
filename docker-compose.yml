# Demo stack. Env is injected at runtime from .env.dev, not baked into the image.
services:
  mock-vendor:
    build: .
    command: pnpm --filter @commission-quote/mock-vendor dev
    env_file:
      - .env.dev
    ports:
      - "4001:4001"

  bff:
    build: .
    command: pnpm --filter @commission-quote/bff dev
    env_file:
      - .env.dev
    ports:
      - "4000:4000"
    depends_on:
      - mock-vendor

  web:
    build: .
    command: pnpm --filter @commission-quote/web dev
    env_file:
      - .env.dev
    ports:
      - "5173:5173"
    depends_on:
      - bff
