# Staff quote page. TLS stops in front of this process in a real bank deployment.
# This file is HTTP on the compose network so a demo does not send HSTS.

worker_processes auto;
error_log /tmp/nginx-error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;

  client_max_body_size 16k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 15s;
  send_timeout 10s;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Quote bodies stay out of the log. The line is method, path, and status only.
  log_format staff '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
  access_log /tmp/nginx-access.log staff;

  # A person at the form does not need more than this.
  limit_req_zone $binary_remote_addr zone=quotes:1m rate=10r/s;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emotion writes inline style tags, so styles allow 'unsafe-inline'. Scripts do not.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location /graphql {
      limit_req zone=quotes burst=20 nodelay;
      proxy_pass http://bff:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # The browser must not supply the vendor key or a fault header.
      proxy_set_header api-key "";
      proxy_set_header x-simulate "";
      proxy_connect_timeout 2s;
      proxy_send_timeout 5s;
      proxy_read_timeout 5s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
      deny all;
    }
  }
}
